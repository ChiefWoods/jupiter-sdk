name: Publish crates
run-name: Publish ${{ github.ref_name }}

on:
  push:
    tags:
      - "jupiter-program-sdk@v*"
  workflow_dispatch:

concurrency:
  group: release-crates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for crates.io OIDC trusted publishing
  contents: write

jobs:
  publish:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Parse tag and verify Cargo.toml
        id: meta
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^([a-z0-9-]+)@v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            echo "::error::Tag '${tag}' does not match crate@vX.Y.Z"
            exit 1
          fi
          crate="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
          name=$(grep -m1 '^name = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          cargo_version=$(awk '
            $0 == "[workspace.package]" { in_ws=1; next }
            in_ws && /^\[/ { in_ws=0 }
            in_ws && /^version = / {
              sub(/^version = "/, "")
              sub(/"$/, "")
              print
              exit
            }
          ' Cargo.toml)
          if [[ "$name" != "$crate" ]]; then
            echo "::error::Package name '${name}' does not match tag crate '${crate}'"
            exit 1
          fi
          if [[ "$cargo_version" != "$version" ]]; then
            echo "::error::Tag version '${version}' does not match workspace version '${cargo_version}'"
            exit 1
          fi

          {
            echo "crate=${crate}"
            echo "version=${version}"
            echo "git_tag=${tag}"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing ${name} ${version} from tag ${tag}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.meta.outputs.git_tag }}" --title "${{ steps.meta.outputs.git_tag }}"

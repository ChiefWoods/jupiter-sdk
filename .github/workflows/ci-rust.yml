name: CI (Rust)

on:
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/lib.rs
      - src/products/*/rust/**
      - .github/workflows/ci-rust.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/lib.rs
      - src/products/*/rust/**
      - .github/workflows/ci-rust.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Cargo check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (workspace)
        run: cargo check --workspace --all-features --locked

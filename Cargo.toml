# Root workspace + published umbrella crate.
# Product Rust clients are unpublished workspace members, re-exported via features.

[workspace]
resolver = "2"
members = [
    ".",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
authors = ["Jupiter"]
homepage = "https://github.com/ChiefWoods/jupiter-sdk"
repository = "https://github.com/ChiefWoods/jupiter-sdk"
keywords = ["jupiter", "solana", "sdk", "defi", "codama"]

[package]
name = "jupiter-program-sdk"
version.workspace = true
description = "Jupiter on-chain product SDKs"
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []

[dependencies]

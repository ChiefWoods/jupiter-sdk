name: CI (JS)

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - turbo.json
      - tsconfig*.json
      - oxfmt.config.ts
      - oxlint.config.ts
      - tsdown.config.ts
      - index.ts
      - src/scripts/**
      - src/products/*/kit/**
      - src/products/*/web3js/**
      - src/products/*/package.json
      - src/products/*/tsconfig.json
      - src/products/*/tsdown.config.ts
      - src/products/*/idl/**
      - .github/workflows/ci-js.yml
  push:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - turbo.json
      - tsconfig*.json
      - oxfmt.config.ts
      - oxlint.config.ts
      - tsdown.config.ts
      - index.ts
      - src/scripts/**
      - src/products/*/kit/**
      - src/products/*/web3js/**
      - src/products/*/package.json
      - src/products/*/tsconfig.json
      - src/products/*/tsdown.config.ts
      - src/products/*/idl/**
      - .github/workflows/ci-js.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-js-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Typecheck, build, lint, and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint:check

      - name: Format
        run: bun run format:check

# Root workspace + published umbrella crate.
# Product crates are also published so the umbrella's path deps can resolve on crates.io.

[workspace]
resolver = "2"
members = [
    ".",
    "src/products/aggregator-v6/rust",
    "src/products/governance/rust",
    "src/products/invite/rust",
    "src/products/lend-borrow/rust",
    "src/products/lend-dex/rust",
    "src/products/lend-earn/rust",
    "src/products/lend-flash-loan/rust",
    "src/products/lend-lending-reward-rate-model/rust",
    "src/products/lend-liquidity/rust",
    "src/products/lend-oracle/rust",
    "src/products/lock/rust",
    "src/products/offerbook/rust",
    "src/products/perps/rust",
    "src/products/prediction/rust",
    "src/products/rewards-hub/rust",
    "src/products/stablecoin/rust",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Jupiter"]
homepage = "https://github.com/ChiefWoods/jupiter-sdk"
repository = "https://github.com/ChiefWoods/jupiter-sdk"
keywords = ["jupiter", "solana", "sdk", "defi", "codama"]

[workspace.dependencies]
jupiter-aggregator-v6-sdk = { path = "src/products/aggregator-v6/rust", version = "0.3.0" }
jupiter-governance-sdk = { path = "src/products/governance/rust", version = "0.3.0" }
jupiter-invite-sdk = { path = "src/products/invite/rust", version = "0.3.0" }
jupiter-lend-borrow-sdk = { path = "src/products/lend-borrow/rust", version = "0.3.0" }
jupiter-lend-dex-sdk = { path = "src/products/lend-dex/rust", version = "0.3.0" }
jupiter-lend-earn-sdk = { path = "src/products/lend-earn/rust", version = "0.3.0" }
jupiter-lend-flash-loan-sdk = { path = "src/products/lend-flash-loan/rust", version = "0.3.0" }
jupiter-lend-lending-reward-rate-model-sdk = { path = "src/products/lend-lending-reward-rate-model/rust", version = "0.3.0" }
jupiter-lend-liquidity-sdk = { path = "src/products/lend-liquidity/rust", version = "0.3.0" }
jupiter-lend-oracle-sdk = { path = "src/products/lend-oracle/rust", version = "0.3.0" }
jupiter-lock-sdk = { path = "src/products/lock/rust", version = "0.3.0" }
jupiter-offerbook-sdk = { path = "src/products/offerbook/rust", version = "0.3.0" }
jupiter-perps-sdk = { path = "src/products/perps/rust", version = "0.3.0" }
jupiter-prediction-sdk = { path = "src/products/prediction/rust", version = "0.3.0" }
jupiter-rewards-hub-sdk = { path = "src/products/rewards-hub/rust", version = "0.3.0" }
jupiter-stablecoin-sdk = { path = "src/products/stablecoin/rust", version = "0.3.0" }

[package]
name = "jupiter-program-sdk"
version.workspace = true
description = "Jupiter on-chain program SDKs"
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[lib]
path = "src/lib.rs"

[features]
default = []
aggregator-v6 = ["dep:jupiter-aggregator-v6-sdk"]
governance = ["dep:jupiter-governance-sdk"]
invite = ["dep:jupiter-invite-sdk"]
lend-borrow = ["dep:jupiter-lend-borrow-sdk"]
lend-dex = ["dep:jupiter-lend-dex-sdk"]
lend-earn = ["dep:jupiter-lend-earn-sdk"]
lend-flash-loan = ["dep:jupiter-lend-flash-loan-sdk"]
lend-lending-reward-rate-model = ["dep:jupiter-lend-lending-reward-rate-model-sdk"]
lend-liquidity = ["dep:jupiter-lend-liquidity-sdk"]
lend-oracle = ["dep:jupiter-lend-oracle-sdk"]
lock = ["dep:jupiter-lock-sdk"]
offerbook = ["dep:jupiter-offerbook-sdk"]
perps = ["dep:jupiter-perps-sdk"]
prediction = ["dep:jupiter-prediction-sdk"]
rewards-hub = ["dep:jupiter-rewards-hub-sdk"]
stablecoin = ["dep:jupiter-stablecoin-sdk"]

[dependencies]
jupiter-aggregator-v6-sdk = { workspace = true, optional = true }
jupiter-governance-sdk = { workspace = true, optional = true }
jupiter-invite-sdk = { workspace = true, optional = true }
jupiter-lend-borrow-sdk = { workspace = true, optional = true }
jupiter-lend-dex-sdk = { workspace = true, optional = true }
jupiter-lend-earn-sdk = { workspace = true, optional = true }
jupiter-lend-flash-loan-sdk = { workspace = true, optional = true }
jupiter-lend-lending-reward-rate-model-sdk = { workspace = true, optional = true }
jupiter-lend-liquidity-sdk = { workspace = true, optional = true }
jupiter-lend-oracle-sdk = { workspace = true, optional = true }
jupiter-lock-sdk = { workspace = true, optional = true }
jupiter-offerbook-sdk = { workspace = true, optional = true }
jupiter-perps-sdk = { workspace = true, optional = true }
jupiter-prediction-sdk = { workspace = true, optional = true }
jupiter-rewards-hub-sdk = { workspace = true, optional = true }
jupiter-stablecoin-sdk = { workspace = true, optional = true }
